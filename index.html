<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Propithub — Property Operations Platform</title>
    <meta name="description" content="Production-ready property operations platform for owners, managers, tenants, and maintenance teams." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && (k.indexOf('firestore_mutations_') === 0 || k.indexOf('firestore_clients_') === 0 || k.indexOf('firestore_') === 0)) {
                toRemove.push(k);
              }
            }
            for (var j = 0; j < toRemove.length; j++) {
              localStorage.removeItem(toRemove[j]);
            }
          }
          if (typeof window !== 'undefined' && window.Storage && !window.Storage.prototype.__quotaPatched) {
            var origSetItem = Storage.prototype.setItem;
            Storage.prototype.setItem = function(key, value) {
              try {
                return origSetItem.apply(this, [key, value]);
              } catch (err) {
                if (err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014 || /quota/i.test(err.message || ''))) {
                  try {
                    var purge = [];
                    for (var m = 0; m < this.length; m++) {
                      var pk = this.key(m);
                      if (pk && (pk.indexOf('firestore_mutations_') === 0 || pk.indexOf('firestore_clients_') === 0)) {
                        purge.push(pk);
                      }
                    }
                    for (var n = 0; n < purge.length; n++) {
                      this.removeItem(purge[n]);
                    }
                    return origSetItem.apply(this, [key, value]);
                  } catch (_) {
                    return;
                  }
                }
                throw err;
              }
            };
            window.Storage.prototype.__quotaPatched = true;
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
