name: Deploy to Firebase

# Deploys the website (hosting) and the Cloud Functions to the propithub
# Firebase project whenever code lands on main. It can also be run by hand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build the website
        run: |
          npm ci
          npm run build

      - name: Install and build the functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Deploy hosting and functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing. See the pull request for setup." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,functions --project propithub --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
