name: Deploy to Firebase

# Deploys the Cloud Functions to the propithub Firebase project whenever code
# lands on main. The website (hosting) is NOT deployed from here because the
# build needs the private VITE_FIREBASE_* settings that are not in the repo. It can also be run by hand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build the functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Sign in to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@propithub.iam.gserviceaccount.com

      - name: Deploy functions
        run: npx --yes firebase-tools@13 deploy --only functions --project propithub --non-interactive --force
