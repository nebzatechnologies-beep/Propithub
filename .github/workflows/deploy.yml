name: Deploy to Firebase

# Builds the website with the Firebase settings stored as GitHub secrets, then
# deploys hosting, Firestore rules and Cloud Functions to the propithub project
# whenever code lands on main. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stop before deploying anything if a setting is missing, so the live
      # site can never be replaced by a blank build.
      - name: Check Firebase settings are present
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret $v - add it under Settings > Secrets and variables > Actions"; exit 1; fi
          done

      - name: Build the website
        run: |
          npm ci
          npm run build

      - name: Verify the build contains the Firebase key
        run: grep -rq "${VITE_FIREBASE_API_KEY}" dist || { echo "::error::Build is missing the Firebase key"; exit 1; }

      - name: Install and build the functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Sign in to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@propithub.iam.gserviceaccount.com

      - name: Deploy hosting and Firestore rules
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project propithub --non-interactive --force

      - name: Deploy functions
        run: npx --yes firebase-tools@13 deploy --only functions --project propithub --non-interactive --force
